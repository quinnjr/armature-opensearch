[package]
name = "armature-opensearch"
version = "0.3.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-opensearch"
homepage = "https://quinnjr.github.io/armature"
description = "OpenSearch integration for the Armature framework"
keywords = ["opensearch", "elasticsearch", "search", "armature", "full-text"]
categories = ["database", "web-programming"]

[features]
default = ["rustls"]
# TLS backends
rustls = ["opensearch/rustls-tls"]
native-tls = ["opensearch/native-tls"]
# AWS authentication
aws-auth = ["dep:aws-config", "dep:aws-credential-types", "dep:aws-types", "opensearch/aws-auth"]

[dependencies]
armature-core = { version = "0" }
armature-log = { version = "0" }

# OpenSearch client
opensearch = { version = "2", default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1", features = ["sync"] }
async-trait = "0.1"

# Error handling
thiserror = "2.0"

# Optional AWS auth
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"], optional = true }
aws-credential-types = { version = "1", optional = true }
aws-types = { version = "1", optional = true }

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
armature-testkit = { path = "../armature-testkit" }
aws-credential-types = { version = "1", features = ["test-util"] }

