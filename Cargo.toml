[package]
name = "armature-opensearch"
version = "0.4.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-opensearch"
homepage = "https://quinnjr.github.io/armature"
description = "OpenSearch integration for the Armature framework"
keywords = ["opensearch", "elasticsearch", "search", "armature", "full-text"]
categories = ["database", "web-programming"]

[features]
default = ["rustls"]
# TLS backends
rustls = ["opensearch/rustls-tls"]
native-tls = ["opensearch/native-tls"]
# AWS authentication
aws-auth = ["dep:aws-smithy-types", "dep:aws-config", "dep:aws-credential-types", "dep:aws-types", "opensearch/aws-auth"]

[dependencies]
armature-core = { version = "0.9" }
armature-log = { version = "0.2" }

# OpenSearch client
opensearch = { version = "2", default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1", features = ["sync"] }
async-trait = "0.1"

# Error handling
thiserror = "2.0"

# SDK default features are off to drop the legacy hyper-0.14 client and its
# h2 0.3 (RUSTSEC-2026-0258); the hyper-1 `default-https-client` is kept.
# Optional AWS auth
aws-config = { version = "1.12.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"], optional = true }
aws-credential-types = { version = "1.3.0", optional = true }
aws-types = { version = "1.6.0", optional = true }
# Held below 1.7 so a fresh resolve (Cargo.lock is not committed) picks the
# aws-sdk-*/aws-runtime releases that still build with aws-config 1.12's
# aws-smithy-json 0.63. Drop this once aws-config moves to aws-smithy-json 0.64.
aws-smithy-types = { version = ">=1.6.3, <1.7", optional = true }

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
armature-testkit = { path = "../armature-testkit" }
aws-credential-types = { version = "1.3.0", features = ["test-util"] }

